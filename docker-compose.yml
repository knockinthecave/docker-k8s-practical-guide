# 실습용 값이다. 실제 환경에서는 .env / 시크릿으로 분리할 것.
#
# - 최상위 `version:` 키는 현재 Compose(v2+)에서 obsolete 라서 쓰지 않는다.
# - YAML 은 들여쓰기(스페이스 2칸)로 계층(종속 관계)을 표현한다. 탭은 사용 불가.
# - 네트워크는 선언하지 않아도 Compose 가 이 파일 전용 기본 네트워크를 자동 생성하고
#   모든 서비스를 그 안에 넣는다. 그래서 서비스끼리 "서비스명"으로 서로를 찾을 수 있다.
#   (예: backend → postgresdb:5432). 자체 네트워크가 필요할 때만 `networks:` 로 선언한다.

# services: 아래의 각 하위 키(postgresdb / backend / frontend)가 곧 컨테이너 하나이다.
# 키 이름이 서비스명이자, 네트워크 안에서의 호스트명(DNS 이름)이 된다.
services:
  # ── DB ────────────────────────────────────────────────────────────
  postgresdb:
    # 이미 만들어진 이미지를 사용한다. (docker run postgres:16-alpine 에 해당)
    # compose 로 띄우면 기본이 백그라운드(detached)이고 `--rm` 같은 옵션도 필요 없다.
    image: postgres:16-alpine

    # 컨테이너 환경 변수. (docker run -e 에 해당)
    # 키-값 쌍은 `-` 없이 `KEY: value` 형태로 쓴다.
    # (리스트 형태 `- KEY=value` 도 가능하지만 한 파일 안에서는 하나로 통일한다.)
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    # 이런식으로 환경 변수 파일을 분리할 수 있음.
    # env_file:
    #   - ./env/postgres.env

    # "호스트포트:컨테이너포트" (docker run -p 에 해당)
    # 이 줄이 있어야 호스트(내 Mac)에서 localhost:5432 로 DB 에 접속할 수 있다.
    # 없어도 같은 네트워크의 backend 는 postgresdb:5432 로 접속 가능하다.
    ports:
      - "5432:5432"

    # "볼륨이름:컨테이너경로" → 명명된(named) 볼륨. (docker run -v 에 해당)
    # 컨테이너를 지워도 DB 데이터가 pgdata 볼륨에 남는다.
    # 여기서 쓴 볼륨 이름은 맨 아래 최상위 `volumes:` 에도 반드시 선언해야 한다.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # 컨테이너가 "실제로 쓸 수 있는 상태"인지 주기적으로 검사한다.
    # 컨테이너가 떠 있는 것(started)과 DB 가 준비된 것(healthy)은 다르기 때문.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"] # 이 명령이 성공하면 healthy
      interval: 3s # 검사 주기
      timeout: 3s # 1회 검사 제한 시간
      retries: 10 # 연속 실패 허용 횟수, 초과하면 unhealthy

  # ── API 서버 ──────────────────────────────────────────────────────
  backend:
    # image 대신 build 를 쓰면 해당 경로의 Dockerfile 로 이미지를 빌드해서 사용한다.
    # (docker build ./backend 에 해당)
    build: ./backend

    environment:
      # DB 주소의 호스트가 localhost 가 아니라 서비스명(postgresdb)인 점에 주의.
      # 컨테이너 안의 localhost 는 backend 자기 자신이다.
      DATABASE_URL: postgresql://todo:todo@postgresdb:5432/todo

    # 호스트 8000 → 컨테이너 8000. 브라우저/Postman 에서 localhost:8000 으로 API 호출 가능.
    ports:
      - "8000:8000"

    # 시작 순서 제어. postgresdb 가 healthy 가 된 뒤에 backend 를 시작한다.
    # condition 을 생략하면 "컨테이너가 시작됐는지"만 보고 DB 준비 여부는 기다리지 않는다.
    depends_on:
      postgresdb:
        condition: service_healthy

  # ── 웹 UI ─────────────────────────────────────────────────────────
  frontend:
    # React 를 빌드해서 nginx 로 서빙하는 이미지. /api 요청은 nginx 가 backend 로 프록시한다.
    build: ./frontend

    # 호스트 3000 → 컨테이너 80(nginx). 접속 주소: http://localhost:3000
    ports:
      - "3000:80"

    # 간단 형태(리스트): backend 컨테이너가 시작된 뒤에 시작한다.
    depends_on:
      - backend

# 최상위 volumes: 서비스에서 사용하는 "명명된 볼륨"을 선언하는 곳.
# `pgdata:` 처럼 이름 뒤에 콜론만 쓰면 기본 설정으로 생성된다.
# 다른 서비스가 같은 볼륨 이름을 쓰면 그 볼륨을 공유한다.
# 익명 볼륨과 바인드 마운트(./경로:/컨테이너경로)는 여기에 선언하지 않는다.
volumes:
  pgdata:
